<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <radialGradient id="bg2" cx="30%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#131c31"/>
      <stop offset="100%" stop-color="#070b14"/>
    </radialGradient>
    <linearGradient id="brand2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#00f2fe"/>
      <stop offset="48%"  stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#00f2fe"/>
      <stop offset="50%"  stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="lb2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="rb2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="sl2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#00f2fe" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="divGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#00f2fe" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#6366f1" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow2" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
    <filter id="glow3" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
    <pattern id="dotG2" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.8" fill="#ffffff" opacity="0.04"/>
    </pattern>
    <clipPath id="roundBanner">
      <rect x="0" y="0" width="1200" height="400" rx="28" ry="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#roundBanner)">
    <!-- Background -->
    <rect width="1200" height="400" fill="url(#bg2)"/>
    <rect width="1200" height="400" fill="url(#dotG2)"/>

    <!-- Ambient glows -->
    <circle cx="200"  cy="200" r="180" fill="#6366f1" opacity="0.08" filter="url(#glow3)"/>
    <circle cx="1050" cy="200" r="160" fill="#ec4899" opacity="0.07" filter="url(#glow3)"/>
    <circle cx="600"  cy="400" r="140" fill="#00f2fe" opacity="0.05" filter="url(#glow3)"/>

    <!-- ============================================================
         ICON SECTION (left, ~square 400x400)
         ============================================================ -->
    <!-- Icon background pill -->
    <rect x="30" y="30" width="340" height="340" rx="52" ry="52" fill="#0c1322" opacity="0.85"/>
    <rect x="30" y="30" width="340" height="340" rx="52" ry="52" fill="none" stroke="url(#brand2)" stroke-width="1.5" opacity="0.45"/>

    <!-- Left bracket -->
    <polyline points="168,100 112,200 168,300"
      fill="none" stroke="url(#lb2)" stroke-width="22"
      stroke-linecap="round" stroke-linejoin="round"
      filter="url(#glow2)"/>

    <!-- Right bracket -->
    <polyline points="232,100 288,200 232,300"
      fill="none" stroke="url(#rb2)" stroke-width="22"
      stroke-linecap="round" stroke-linejoin="round"
      filter="url(#glow2)"/>

    <!-- Slash -->
    <line x1="216" y1="94" x2="184" y2="306"
      stroke="url(#sl2)" stroke-width="16"
      stroke-linecap="round" filter="url(#glow2)"/>

    <!-- Highlight inner lines -->
    <polyline points="168,108 117,200 168,292"
      fill="none" stroke="#00f2fe" stroke-width="2.5"
      stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>
    <polyline points="232,108 283,200 232,292"
      fill="none" stroke="#ec4899" stroke-width="2.5"
      stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>

    <!-- Corner accent dots -->
    <circle cx="168" cy="100" r="7" fill="#00f2fe" opacity="0.8" filter="url(#glow2)"/>
    <circle cx="168" cy="300" r="7" fill="#6366f1" opacity="0.8" filter="url(#glow2)"/>
    <circle cx="232" cy="100" r="7" fill="#6366f1" opacity="0.8" filter="url(#glow2)"/>
    <circle cx="232" cy="300" r="7" fill="#ec4899" opacity="0.8" filter="url(#glow2)"/>

    <!-- Audio bar pulse (bottom of icon) -->
    <rect x="118" y="316" width="6" height="18" rx="3" fill="url(#brand2)" opacity="0.8"/>
    <rect x="130" y="320" width="6" height="12" rx="3" fill="url(#brand2)" opacity="0.65"/>
    <rect x="142" y="312" width="6" height="24" rx="3" fill="url(#brand2)" opacity="0.9"/>
    <rect x="154" y="318" width="6" height="16" rx="3" fill="url(#brand2)" opacity="0.7"/>
    <rect x="166" y="308" width="6" height="28" rx="3" fill="url(#brand2)" opacity="1.0"/>
    <rect x="178" y="314" width="6" height="20" rx="3" fill="url(#brand2)" opacity="0.82"/>
    <rect x="190" y="306" width="6" height="30" rx="3" fill="url(#brand2)" opacity="0.95"/>
    <rect x="202" y="313" width="6" height="22" rx="3" fill="url(#brand2)" opacity="0.78"/>
    <rect x="214" y="307" width="6" height="28" rx="3" fill="url(#brand2)" opacity="0.92"/>
    <rect x="226" y="316" width="6" height="17" rx="3" fill="url(#brand2)" opacity="0.68"/>
    <rect x="238" y="311" width="6" height="24" rx="3" fill="url(#brand2)" opacity="0.85"/>
    <rect x="250" y="319" width="6" height="14" rx="3" fill="url(#brand2)" opacity="0.6"/>
    <rect x="262" y="314" width="6" height="20" rx="3" fill="url(#brand2)" opacity="0.76"/>

    <!-- ============================================================
         DIVIDER LINE
         ============================================================ -->
    <line x1="395" y1="60" x2="395" y2="340"
      stroke="url(#divGrad)" stroke-width="1.5"/>

    <!-- ============================================================
         TEXT SECTION (right)
         ============================================================ -->

    <!-- Main title: "Animation Gallery" -->
    <text
      x="445" y="188"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif"
      font-size="72"
      font-weight="800"
      letter-spacing="-2.5"
      fill="url(#textGrad)">Animation</text>

    <text
      x="445" y="268"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif"
      font-size="72"
      font-weight="800"
      letter-spacing="-2.5"
      fill="url(#textGrad)">Gallery</text>

    <!-- Subtitle -->
    <text
      x="448" y="314"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif"
      font-size="22"
      font-weight="500"
      letter-spacing="4"
      fill="url(#subGrad)"
      opacity="0.8">HTML  ·  CSS  ·  JavaScript</text>

    <!-- Small top label -->
    <rect x="445" y="105" width="172" height="30" rx="15" fill="rgba(99,102,241,0.12)" stroke="rgba(99,102,241,0.3)" stroke-width="1"/>
    <text
      x="531" y="125"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-size="13"
      font-weight="600"
      fill="#38bdf8"
      text-anchor="middle"
      letter-spacing="1.5">57 LIVE DEMOS</text>

    <!-- Decorative bottom line accent -->
    <line x1="445" y1="336" x2="1160" y2="336"
      stroke="url(#textGrad)" stroke-width="2" opacity="0.3" stroke-linecap="round"/>

    <!-- Author credit -->
    <text
      x="448" y="358"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-size="14"
      font-weight="400"
      fill="#64748b"
      letter-spacing="0.5">by Suleiman Hajizadeh  ·  Western Caspian University</text>
  </g>

  <!-- Outer border ring -->
  <rect x="1.5" y="1.5" width="1197" height="397" rx="28" ry="28"
    fill="none" stroke="url(#brand2)" stroke-width="2" opacity="0.4"/>
</svg>
