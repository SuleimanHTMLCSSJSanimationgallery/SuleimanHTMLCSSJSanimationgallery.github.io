<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found | Suleiman HTML CSS JS Animation Gallery</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .error-container {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem 1.5rem;
      position: relative;
      z-index: 1;
    }
    .error-code {
      font-size: clamp(5rem, 15vw, 10rem);
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.05em;
      background: var(--gradient-brand);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
      filter: drop-shadow(0 0 40px rgba(99, 102, 241, 0.4));
    }
    .error-title {
      font-size: clamp(1.4rem, 3vw, 2.2rem);
      font-weight: 700;
      margin-bottom: 1rem;
    }
    .error-desc {
      color: var(--text-secondary);
      max-width: 500px;
      margin-bottom: 2rem;
      font-size: 1rem;
    }
    .error-actions {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }
  </style>
</head>
<body>
  <div class="bg-atmosphere" aria-hidden="true">
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>
    <div class="glow-orb orb-3"></div>
  </div>

  <header class="navbar">
    <div class="nav-container">
      <a href="./index.html" class="brand-link">
        <div class="brand-logo">
          <img src="logo.svg" alt="Animation Gallery Logo" width="38" height="38" style="border-radius:10px;display:block;" />
        </div>
        <span class="brand-title">AnimationGallery</span>
      </a>
      <div class="nav-actions">
        <a href="https://github.com/SuleimanHTMLCSSJSanimationgallery" target="_blank" rel="noopener noreferrer" class="btn-icon" title="GitHub Organization">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg>
        </a>
      </div>
    </div>
  </header>

  <main class="error-container">
    <div class="error-code">404</div>
    <h1 class="error-title">Page or Animation Not Found</h1>
    <p class="error-desc">
      The requested URL or animation demo does not exist or has been relocated within the gallery catalog.
    </p>
    <div class="error-actions">
      <a href="./index.html" class="btn-preview" style="padding: 0.8rem 1.6rem; text-decoration: none;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>Return to 57 Demos Gallery</span>
      </a>
      <a href="https://github.com/SuleimanHTMLCSSJSanimationgallery/SuleimanHTMLCSSJSanimationgallery" target="_blank" rel="noopener noreferrer" class="btn-secondary" style="padding: 0.8rem 1.6rem;">
        <span>Browse GitHub Source Code</span>
      </a>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-content">
      <div class="footer-brand">
        <h4>Suleiman HTML CSS JS Animation Gallery</h4>
        <p>Western Caspian University • Baku, Azerbaijan</p>
      </div>
    </div>
  </footer>
</body>
</html>
